<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>OpenLayers + Timeline (Niterói View)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@latest/ol.css">
  <link href="css/singlePageTemplate.css" rel="stylesheet" type="text/css">
  <style>
    html, body { height: 100%; margin: 0; padding: 0; }
    #map { width: 100vw; height: calc(100vh - 50px); }
    #timeline-container {
      position: fixed;
      left: 50%;
      bottom: 16px;
      top: auto;
      transform: translateX(-50%);
      z-index: 1200;
      background: rgba(255,255,255,0.95);
      border-radius: 14px;
      padding: 16px 2vw 18px 2vw;
      box-shadow: 0 2px 16px rgba(0,0,0,0.18);
      z-index: 1000;
      font-family: Arial, sans-serif;
      min-width: 260px;
      max-width: 98vw;
      width: 90vw;
    }
    #timeline-flex-row {
      width: 100%;
      display: flex;
      flex-direction: row;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
    }
    #timeline-slider-col {
      flex: 1 1 0;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      min-width: 0;
    }
    #timeline-slider-col input[type=range] {
      width: 100%;
      margin: 0;
    }
    #timeline-ticks {
      width: 100%;
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      position: relative;
      margin-top: 2px;
      font-size: 12px;
      color: #444;
      pointer-events: none;
      user-select: none;
    }
    #timeline-ticks span {
      min-width: 26px;
      text-align: center;
      flex: 1 1 auto;
      white-space: nowrap;
      opacity: 0.8;
      font-size: 12px;
    }
    #timeline-ano-col {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: flex-end;
      min-width: 70px;
      margin-left: 12px;
    }
    #timeline-label {
      font-size: 16px;
      font-weight: bold;
      color: #444;
      margin: 0;
      padding: 0;
    }
    #year-value {
      font-size: 18px;
      color: #1976d2;
      font-weight: bold;
      min-width: 56px;
      text-align: right;
      letter-spacing: 0.5px;
      margin: 0;
      padding: 0;
    }
    @media (max-width: 600px) {
      #timeline-flex-row {
        flex-direction: column;
        gap: 8px;
        align-items: stretch;
      }
      #timeline-ano-col {
        flex-direction: row;
        align-items: center;
        justify-content: flex-end;
        margin-left: 0;
        gap: 6px;
      }
      #year-value {
        font-size: 15px;
        min-width: 38px;
      }
      #timeline-ticks span {
        font-size: 11px;
        min-width: 20px;
      }
    }
    #timeline-label {
      font-size: 16px;
      margin-right: 8px;
      font-weight: bold;
    }
    #year-value {
      font-size: 16px;
      color: #1976d2;
      margin-left: 8px;
      font-weight: bold;
    }
    #timeline-slider-wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      margin-top: 2px;
    }
    #timeline-slider-row {
      width: 100%;
      display: flex;
      flex-direction: row;
      align-items: center;
      margin-top: 0;
      margin-bottom: 2px;
    }
    #timeline-slider-row input[type=range] {
      flex: 1 1 auto;
      width: 100%;
      margin: 0;
    }
    #year-value {
      font-size: 17px;
      color: #1976d2;
      margin-left: 12px;
      font-weight: bold;
      min-width: 56px;
      text-align: right;
      letter-spacing: 0.5px;
    }
    #timeline-ticks {
      width: 100%;
      margin-left: 0;
      margin-right: 0;
    }
    @media (max-width: 600px) {
      #timeline-slider-wrap {
        gap: 6px;
      }
      #year-value {
        font-size: 15px;
        min-width: 38px;
        margin-left: 7px;
      }
    }
    #timeline {
      width: 100%;
      margin: 0;
      padding: 0;
      background: none;
      z-index: 2;
    }
    #timeline-ticks {
      width: 100%;
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      position: relative;
      margin-top: 2px;
      font-size: 12px;
      color: #444;
      pointer-events: none;
      user-select: none;
    }
    #timeline-ticks span {
      min-width: 26px;
      text-align: center;
      flex: 1 1 auto;
      white-space: nowrap;
      opacity: 0.8;
      font-size: 12px;
    }
    @media (max-width: 600px) {
      #timeline-container {
        padding: 8px 2vw 10px 2vw;
        min-width: unset;
        font-size: 14px;
        width: 99vw;
        max-width: 99vw;
      }
      #timeline-ticks span {
        font-size: 11px;
        min-width: 20px;
      }
    }
    #timeline-label {
      font-size: 16px;
      margin-right: 16px;
      font-weight: bold;
    }
    #year-value {
      font-size: 16px;
      color: #1976d2;
      margin-left: 8px;
      font-weight: bold;
    }
    .ol-popup {
      position: absolute;
      background-color: white;
      padding: 8px 12px;
      border-radius: 4px;
      border: 1px solid #ccc;
      bottom: 12px;
      left: -50px;
      min-width: 180px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      font-family: Arial, sans-serif;
      font-size: 14px;
      z-index: 100;
    }
  </style>

<body>
  <!-- Main Container -->
<div class="container">
  <!-- Navigation -->
  <header>
    <a href="index.html">
      <div>
        <h4 class="logo">
          NITERÓI VIEW
        </h4>
      </div>
    </a>
    <nav>
      <div class="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <ul>
        <li><a href="WebMap.html">WEBMAP</a></li>
        <li><a href="#about">SOBRE</a></li>
        <li><a href="#contact">CONTATO</a></li>
      </ul>
    </nav>
  </header>
    <!-- Hero Section -->
  <div id="map"></div>
  <div id="timeline-container">
    <div id="timeline-flex-row">
      <div id="timeline-slider-col">
        <input type="range" id="timeline" min="1820" max="2020" step="5" value="2020">
        <div id="timeline-ticks"></div>
      </div>
      <div id="timeline-ano-col" style="display: flex; flex-direction: row; align-items: center; justify-content: flex-end; margin-left: 12px;">
        <span id="timeline-label" style="font-size: 16px; font-weight: bold; margin-right: 0px;">Ano:</span>
        <span id="year-value" style="font-size: 16px; color: #1976d2; font-weight: bold;">2020</span>
      </div>
    </div>
  </div>
  <div id="popup" class="ol-popup" style="display:none;"></div>
  <script src="https://cdn.jsdelivr.net/npm/ol@latest/dist/ol.js"></script>
  <script src="data/Agua_Niteroi_0.js"></script>
  <script src="data/Terreno_Niteroi_1.js"></script>
  <script src="data/Lagunas_2.js"></script>
  <script src="data/Area_Urbana_4.js"></script>
  <script src="data/CurvasdeNvel_5.js"></script>
  <script src="data/Logradouros_6.js"></script>
  <script src="data/EdifciosHistricos_7.js"></script>
  <script src="styles/Agua_Niteroi_0_style.js"></script>
  <script src="styles/Terreno_Niteroi_1_style.js"></script>
  <script src="styles/Lagunas_2_style.js"></script>
  <script src="styles/Area_Urbana_4_style.js"></script>
  <script src="styles/CurvasdeNvel_5_style.js"></script>
  <script src="styles/Logradouros_6_style.js"></script>
  <script src="styles/EdifciosHistricos_7_style.js"></script>
  <script>
    // Função para gerar ticks de anos responsivos
    function renderTimelineTicks() {
      const ticksDiv = document.getElementById('timeline-ticks');
      const slider = document.getElementById('timeline');
      const min = 1820; // fixo para garantir ticks corretos
      const max = parseInt(slider.max);
      const step = parseInt(slider.step);
      let nTicks = Math.floor(slider.offsetWidth / 60);
      if (window.innerWidth < 600) nTicks = Math.floor(slider.offsetWidth / 44);
      nTicks = Math.max(4, Math.min(nTicks, Math.floor((max-min)/step)+1));
      let ticks = [];
      let range = max - min;
      let interval = Math.round(range / (nTicks-1) / step) * step;
      if (interval < step) interval = step;
      for (let year = min; year <= max; year += interval) {
        ticks.push(year);
      }
      if (ticks[ticks.length-1] !== max) ticks[ticks.length-1] = max;
      ticksDiv.innerHTML = '';
      for (let i=0; i<ticks.length; i++) {
        const span = document.createElement('span');
        span.textContent = ticks[i];
        ticksDiv.appendChild(span);
      }
    }
    window.addEventListener('resize', renderTimelineTicks);
    setTimeout(renderTimelineTicks, 200);
    // Atualizar ticks ao carregar e ao mudar tamanho
    document.addEventListener('DOMContentLoaded', renderTimelineTicks);
    // Função para filtrar ruas pelo ano
    function filtrarRuasPorAno(geojson, ano) {
      return {
        type: 'FeatureCollection',
        features: geojson.features.filter(f => {
          const abertura = f.properties.data_abert ? parseInt(f.properties.data_abert.substring(0,4)) : 0;
          const fechamento = f.properties.data_fecha ? parseInt(f.properties.data_fecha.substring(0,4)) : null;
          return abertura <= ano && (!fechamento || fechamento >= ano);
        })
      };
    }

    // Inicialização
    let anoAtual = 2020;

    // --- Função auxiliar para texto (adaptada do qgis2web) ---
    function createTextStyle(feature, resolution, labelText, labelFont, labelFill, placement, bufferColor, bufferWidth) {
      return new ol.style.Text({
        font: labelFont,
        text: labelText,
        fill: new ol.style.Fill({color: labelFill}),
        stroke: bufferColor && bufferWidth > 0 ? new ol.style.Stroke({color: bufferColor, width: bufferWidth}) : undefined,
        placement: placement,
        overflow: true
      });
    }

    // --- Camadas vetoriais com estilos do QGIS/qgis2web ---
    // Água
    const aguaSource = new ol.source.Vector({
      features: new ol.format.GeoJSON().readFeatures(json_Agua_Niteroi_0, {featureProjection: 'EPSG:3857'})
    });
    const aguaLayer = new ol.layer.Vector({
      source: aguaSource,
      style: style_Agua_Niteroi_0,
      title: 'Água'
    });

    // Terreno (com timeline)
    let terrenoSource = new ol.source.Vector({});
    const terrenoLayer = new ol.layer.Vector({
      source: terrenoSource,
      style: style_Terreno_Niteroi_1,
      title: 'Terreno'
    });

    // Lagunas
    const lagunasSource = new ol.source.Vector({
      features: new ol.format.GeoJSON().readFeatures(json_Lagunas_2, {featureProjection: 'EPSG:3857'})
    });
    const lagunasLayer = new ol.layer.Vector({
      source: lagunasSource,
      style: style_Lagunas_2,
      title: 'Lagunas'
    });

    // Área Urbana (com timeline)
    let areaUrbanaSource = new ol.source.Vector({});
    const areaUrbanaLayer = new ol.layer.Vector({
      source: areaUrbanaSource,
      style: style_Area_Urbana_4,
      title: 'Área Urbana'
    });

    // Curvas de Nível
    const curvasSource = new ol.source.Vector({
      features: new ol.format.GeoJSON().readFeatures(json_CurvasdeNvel_5, {featureProjection: 'EPSG:3857'})
    });
    const curvasLayer = new ol.layer.Vector({
      source: curvasSource,
      style: style_CurvasdeNvel_5,
      title: 'Curvas de Nível'
    });

    // Edifícios Históricos (com timeline)
    let edifSource = new ol.source.Vector({});
    const edifLayer = new ol.layer.Vector({
      source: edifSource,
      style: style_EdifciosHistricos_7,
      title: 'Edifícios Históricos'
    });

    // Logradouros (com timeline)
    let logradourosSource = new ol.source.Vector({});
    /*function style_Logradouros_6(feature, resolution){
    var labelText = "";
    var labelFont = "5.2px 'Arial', sans-serif";
    var labelFill = "#323232";
    var bufferColor = "";
    var bufferWidth = 0;
    var placement = 'line';
    var nome = feature.get("nome_compl");
    if (nome && resolution > 0 && resolution < 14) {
        // Calcular comprimento da linha em pixels
        var geom = feature.getGeometry();
        // Converter para coordenadas do pixel atual
        var coords = geom.getCoordinates();
        var lengthPx = 0;
        if (geom.getType() === 'LineString') {
            for (var i = 1; i < coords.length; i++) {
                var dx = (coords[i][0] - coords[i-1][0]) / resolution;
                var dy = (coords[i][1] - coords[i-1][1]) / resolution;
                lengthPx += Math.sqrt(dx*dx + dy*dy);
            }
        } else if (geom.getType() === 'MultiLineString') {
            coords.forEach(function(line) {
                for (var i = 1; i < line.length; i++) {
                    var dx = (line[i][0] - line[i-1][0]) / resolution;
                    var dy = (line[i][1] - line[i-1][1]) / resolution;
                    lengthPx += Math.sqrt(dx*dx + dy*dy);
                }
            });
        }
        // Estimar comprimento do texto (ajuste o fator conforme necessário)
        var textLength = nome.length * 6.5; // 6.5px por caractere para fonte 5.2px
        if (lengthPx > textLength + 20) { // 20px de margem
            labelText = String(nome);
        }
    }
    return [ new ol.style.Style({
        stroke: new ol.style.Stroke({color: 'rgba(255,255,255,1.0)', lineDash: null, lineCap: 'round', lineJoin: 'round', width: 3.3744}),
        text: createTextStyle(feature, resolution, labelText, labelFont, labelFill, placement, bufferColor, bufferWidth)
    })];
    }*/
    let logradourosLayer = new ol.layer.Vector({
      source: logradourosSource,
      style: style_Logradouros_6,
      title: 'Logradouros (ruas)'
    });

    // Função para filtrar qualquer camada GeoJSON pelo ano
    function filtrarFeaturesPorAno(geojson, ano) {
      return geojson.features.filter(f => {
        const abertura = f.properties.data_abert ? parseInt(f.properties.data_abert.substring(0,4)) : 0;
        const fechamento = f.properties.data_fecha ? parseInt(f.properties.data_fecha.substring(0,4)) : null;
        return abertura <= ano && (!fechamento || fechamento >= ano);
      });
    }

    // Mapa
    const map = new ol.Map({
      target: 'map',
      layers: [
        aguaLayer,
        terrenoLayer,
        lagunasLayer,
        areaUrbanaLayer,
        curvasLayer,
        logradourosLayer,
        edifLayer
      ],
      view: new ol.View({
        center: ol.proj.fromLonLat([-43.103, -22.903]),
        zoom: 13,
        minZoom: 11,
        maxZoom: 18
      })
    });

    // Atualiza todas as camadas temporais conforme o ano
    function atualizarCamadasTemporais(ano) {
      const format = new ol.format.GeoJSON();
      // Logradouros
      const filtradoLogradouros = filtrarRuasPorAno(json_Logradouros_6, ano);
      const featsLogradouros = format.readFeatures(filtradoLogradouros, { featureProjection: 'EPSG:3857' });
      logradourosSource.clear();
      logradourosSource.addFeatures(featsLogradouros);
      // Terreno
      const filtradoTerreno = filtrarFeaturesPorAno(json_Terreno_Niteroi_1, ano);
      const featsTerreno = format.readFeatures({type:'FeatureCollection',features:filtradoTerreno}, { featureProjection: 'EPSG:3857' });
      terrenoSource.clear();
      terrenoSource.addFeatures(featsTerreno);
      // Edifícios Históricos
      const filtradoEdif = filtrarFeaturesPorAno(json_EdifciosHistricos_7, ano);
      const featsEdif = format.readFeatures({type:'FeatureCollection',features:filtradoEdif}, { featureProjection: 'EPSG:3857' });
      edifSource.clear();
      edifSource.addFeatures(featsEdif);
      // Área Urbana
      const filtradoArea = filtrarFeaturesPorAno(json_Area_Urbana_4, ano);
      const featsArea = format.readFeatures({type:'FeatureCollection',features:filtradoArea}, { featureProjection: 'EPSG:3857' });
      areaUrbanaSource.clear();
      areaUrbanaSource.addFeatures(featsArea);
    }
    atualizarCamadasTemporais(anoAtual);

    // Controle timeline
    const timeline = document.getElementById('timeline');
    const yearValue = document.getElementById('year-value');
    timeline.addEventListener('input', function() {
      anoAtual = parseInt(this.value);
      yearValue.textContent = anoAtual;
      atualizarCamadasTemporais(anoAtual);
      renderTimelineTicks();
    });

    // Popups
    const popup = document.getElementById('popup');
    map.on('singleclick', function(evt) {
      const feature = map.forEachFeatureAtPixel(evt.pixel, f => f);
      if (feature) {
        const props = feature.getProperties();
        let html = '';
        if (props.nome_compl || props.nome_pop) {
          html += `<b>${props.nome_compl || ''}</b>`;
          if (props.nome_pop && props.nome_pop !== '-') html += `<br><i>(${props.nome_pop})</i>`;
          if (props.no_ant && props.no_ant !== '-') html += `<br><small>Nome anterior: ${props.no_ant}</small>`;
          if (props.bairro_esq) html += `<br>Bairro: ${props.bairro_esq}`;
          if (props.data_abert) html += `<br>Abertura: ${props.data_abert}`;
          if (props.legislacao && props.legislacao !== '-') html += `<br>Legislação: ${props.legislacao}`;
        } else if (props.Nome || props.nome) {
          html += `<b>${props.Nome || props.nome}</b>`;
        } else {
          html += '<b>Camada</b>';
        }
        popup.innerHTML = html;
        popup.style.display = 'block';
        popup.style.left = (evt.pixel[0] + 10) + 'px';
        popup.style.top = (evt.pixel[1] - 30) + 'px';
      } else {
        popup.style.display = 'none';
      }
    });
    map.on('movestart', function() { popup.style.display = 'none'; });

    // Controle de camadas (ligar/desligar overlays)
    const layerSwitcherDiv = document.createElement('div');
    layerSwitcherDiv.style.position = 'absolute';
    layerSwitcherDiv.style.top = '80px';
    layerSwitcherDiv.style.right = '20px';
    layerSwitcherDiv.style.background = 'rgba(255,255,255,0.95)';
    layerSwitcherDiv.style.padding = '10px 16px 10px 16px';
    layerSwitcherDiv.style.borderRadius = '8px';
    layerSwitcherDiv.style.boxShadow = '0 2px 8px rgba(0,0,0,0.15)';
    layerSwitcherDiv.style.zIndex = '1100';
    layerSwitcherDiv.style.fontFamily = 'Arial, sans-serif';
    layerSwitcherDiv.innerHTML = '<b>Camadas</b><br>';
    const layers = [aguaLayer, terrenoLayer, lagunasLayer, areaUrbanaLayer, curvasLayer, logradourosLayer, edifLayer];
    layers.forEach(layer => {
      const id = 'layer-' + layer.get('title').replace(/[^a-zA-Z0-9]/g, '');
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.id = id;
      checkbox.checked = layer.getVisible();
      checkbox.onchange = () => layer.setVisible(checkbox.checked);
      const label = document.createElement('label');
      label.htmlFor = id;
      label.style.marginLeft = '4px';
      label.style.marginRight = '12px';
      label.textContent = layer.get('title');
      layerSwitcherDiv.appendChild(checkbox);
      layerSwitcherDiv.appendChild(label);
      layerSwitcherDiv.appendChild(document.createElement('br'));
    });
    document.body.appendChild(layerSwitcherDiv);
  </script>
</body>
</html>
