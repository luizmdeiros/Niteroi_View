<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Geo-História Niterói - WebGL</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@latest/ol.css">
  <link href="css/singlePageTemplate.css" rel="stylesheet" type="text/css">
  <style>
    html, body { height: 100%; margin: 0; padding: 0; }
    #map { width: 100vw; height: calc(100vh - 50px); }
    /* (Copie aqui o restante dos estilos do seu WebMap.html conforme necessário) */
    /* ... (timeline, popup, responsividade, etc.) ... */
  </style>
</head>
<body>
<div class="container">
  <header>
    <a href="index.html">
      <div>
        <h4 class="logo">Geo-História Niterói</h4>
      </div>
    </a>
    <nav>
      <div class="hamburger"><span></span><span></span><span></span></div>
      <ul>
        <li><a href="index.html">INICIO</a></li>
        <li><a href="#about">SOBRE</a></li>
        <li><a href="#contact">CONTATO</a></li>
      </ul>
    </nav>
  </header>
  <div id="map"></div>
  <div id="timeline-container">
    <div id="timeline-flex-row">
      <div id="timeline-slider-col">
        <input type="range" id="timeline" min="1820" max="2020" step="5" value="2020">
        <div id="timeline-ticks"></div>
      </div>
      <div id="timeline-ano-col" style="display: flex; flex-direction: row; align-items: center; justify-content: flex-end; margin-left: 12px;">
        <span id="timeline-label" style="font-size: 16px; font-weight: bold; margin-right: 0px;">Ano:</span>
        <span id="year-value" style="font-size: 16px; color: #1976d2; font-weight: bold;">2020</span>
      </div>
    </div>
  </div>
  <div id="popup" class="ol-popup" style="display:none;"></div>
</div>
<script type="module">
import Map from 'https://cdn.jsdelivr.net/npm/ol@latest/Map.js';
import View from 'https://cdn.jsdelivr.net/npm/ol@latest/View.js';
import GeoJSON from 'https://cdn.jsdelivr.net/npm/ol@latest/format/GeoJSON.js';
import WebGLVectorLayer from 'https://cdn.jsdelivr.net/npm/ol@latest/layer/WebGLVector.js';
import VectorSource from 'https://cdn.jsdelivr.net/npm/ol@latest/source/Vector.js';
import {fromLonLat} from 'https://cdn.jsdelivr.net/npm/ol@latest/proj.js';

// Função para carregar dados GeoJSON externos
async function loadGeoJSON(url) {
  const response = await fetch(url);
  return await response.json();
}

// Carregar todos os GeoJSONs necessários
const [json_Agua, json_Terreno, json_Lagunas, json_AreaUrbana, json_Curvas, json_Logradouros, json_Edif] = await Promise.all([
  loadGeoJSON('data/Agua_Niteroi_0.js'),
  loadGeoJSON('data/Terreno_Niteroi_1.js'),
  loadGeoJSON('data/Lagunas_2.js'),
  loadGeoJSON('data/Area_Urbana_4.js'),
  loadGeoJSON('data/CurvasdeNvel_5.js'),
  loadGeoJSON('data/Logradouros_6.js'),
  loadGeoJSON('data/EdifciosHistricos_7.js')
]);

// Função de filtragem temporal (exemplo para logradouros)
function filtrarRuasPorAno(geojson, ano) {
  return {
    type: 'FeatureCollection',
    features: geojson.features.filter(f => {
      const abertura = f.properties.data_abert ? parseInt(f.properties.data_abert.substring(0,4)) : 0;
      const fechamento = f.properties.data_fecha ? parseInt(f.properties.data_fecha.substring(0,4)) : null;
      return abertura <= ano && (!fechamento || fechamento >= ano);
    })
  };
}

// Inicialização das camadas vetoriais WebGL
let anoAtual = 2020;
const format = new GeoJSON();

function makeSource(geojson) {
  return new VectorSource({
    features: format.readFeatures(geojson, {featureProjection: 'EPSG:3857'})
  });
}

const aguaLayer = new WebGLVectorLayer({
  source: makeSource(json_Agua),
  style: {'stroke-color': '#2d8fff', 'stroke-width': 2}
});
const terrenoLayer = new WebGLVectorLayer({
  source: makeSource(json_Terreno),
  style: {'stroke-color': '#bdb76b', 'stroke-width': 2}
});
const lagunasLayer = new WebGLVectorLayer({
  source: makeSource(json_Lagunas),
  style: {'stroke-color': '#5dc1b9', 'stroke-width': 2}
});
const areaUrbanaLayer = new WebGLVectorLayer({
  source: makeSource(json_AreaUrbana),
  style: {'stroke-color': '#888', 'stroke-width': 2}
});
const curvasLayer = new WebGLVectorLayer({
  source: makeSource(json_Curvas),
  style: {'stroke-color': '#964b00', 'stroke-width': 1}
});
const edifLayer = new WebGLVectorLayer({
  source: makeSource(json_Edif),
  style: {'stroke-color': '#c0392b', 'stroke-width': 2}
});

// Logradouros com rótulo
let logradourosSource = makeSource(filtrarRuasPorAno(json_Logradouros, anoAtual));
const logradourosLayer = new WebGLVectorLayer({
  source: logradourosSource,
  style: {
    'stroke-color': 'rgba(0,0,0,0.7)',
    'stroke-width': 2,
    'text-value': ['get', 'nome'],
    'text-font': 'bold 12px Arial',
    'text-fill-color': '#222',
    'text-stroke-color': '#fff',
    'text-stroke-width': 3
  }
});

const map = new Map({
  target: 'map',
  layers: [aguaLayer, terrenoLayer, lagunasLayer, areaUrbanaLayer, curvasLayer, logradourosLayer, edifLayer],
  view: new View({
    center: fromLonLat([-43.103, -22.903]),
    zoom: 13,
    minZoom: 11,
    maxZoom: 18
  })
});

// Timeline e filtragem dinâmica
const timeline = document.getElementById('timeline');
const yearValue = document.getElementById('year-value');
timeline.addEventListener('input', function() {
  anoAtual = parseInt(this.value);
  yearValue.textContent = anoAtual;
  // Atualizar logradouros
  const filtrado = filtrarRuasPorAno(json_Logradouros, anoAtual);
  logradourosSource.clear();
  logradourosSource.addFeatures(format.readFeatures(filtrado, {featureProjection: 'EPSG:3857'}));
  // (Adapte para atualizar outras camadas temporais se necessário)
});

// Popups
const popup = document.getElementById('popup');
map.on('singleclick', function(evt) {
  map.forEachFeatureAtPixel(evt.pixel, function(feature) {
    const props = feature.getProperties();
    let html = '';
    if (props.nome_compl || props.nome_pop) {
      html += `<b>${props.nome_compl || ''}</b>`;
      if (props.nome_pop) html += `<br><i>${props.nome_pop}</i>`;
    }
    if (props.nome_ant) html += `<br><span>Nome antigo: ${props.nome_ant}</span>`;
    if (props.bairro) html += `<br>Bairro: ${props.bairro}`;
    if (props.data_abert) html += `<br>Abertura: ${props.data_abert}`;
    if (props.data_fecha) html += `<br>Fechamento: ${props.data_fecha}`;
    if (props.legis) html += `<br>Legislação: ${props.legis}`;
    if (html) {
      popup.innerHTML = html;
      popup.style.display = 'block';
      popup.style.left = evt.pixel[0] + 'px';
      popup.style.top = evt.pixel[1] + 'px';
    } else {
      popup.style.display = 'none';
    }
  });
});
// Fechar popup ao clicar fora
map.on('pointermove', function() { popup.style.display = 'none'; });

// Timeline ticks responsivos (adapte conforme seu renderTimelineTicks)
function renderTimelineTicks() {
  const ticksDiv = document.getElementById('timeline-ticks');
  const slider = document.getElementById('timeline');
  const min = 1820;
  const max = parseInt(slider.max);
  const step = parseInt(slider.step);
  let nTicks = Math.floor(slider.offsetWidth / 60);
  if (window.innerWidth < 600) nTicks = Math.floor(slider.offsetWidth / 44);
  nTicks = Math.max(4, Math.min(nTicks, Math.floor((max-min)/step)+1));
  let ticks = [];
  let range = max - min;
  let interval = Math.round(range / (nTicks-1) / step) * step;
  if (interval < step) interval = step;
  for (let year = min; year <= max; year += interval) {
    ticks.push(year);
  }
  if (ticks[ticks.length-1] !== max) ticks[ticks.length-1] = max;
  ticksDiv.innerHTML = '';
  for (let i=0; i<ticks.length; i++) {
    const span = document.createElement('span');
    span.textContent = ticks[i];
    ticksDiv.appendChild(span);
  }
}
window.addEventListener('resize', renderTimelineTicks);
document.addEventListener('DOMContentLoaded', renderTimelineTicks);
</script>
</body>
</html>
